name: Build Android APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Permitir execução do Gradle
        run: chmod +x gradlew

      - name: Testar estrutura do banco
        run: python3 validacao/test_schema.py

      - name: Preparar assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Secret ANDROID_KEYSTORE_BASE64 não configurado."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/literariamente-release.jks"

      - name: Build APK assinado
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/literariamente-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_PASSWORD" ] || [ -z "$ANDROID_KEY_ALIAS" ] || [ -z "$ANDROID_KEY_PASSWORD" ]; then
            echo "Secrets de assinatura incompletos."
            exit 1
          fi
          ./gradlew assembleRelease -PappVersionCode=${{ github.run_number }}

      - name: Renomear APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/Literariamente-Biblio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: Literariamente-Biblio
          path: app/build/outputs/apk/release/Literariamente-Biblio.apk

      - name: Publicar Release
        if: github.event_name == 'push' && github.event.head_commit.message == 'Publica release do Literariamente'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="v1.0.${GITHUB_RUN_NUMBER}"
          gh release create "$VERSION"             app/build/outputs/apk/release/Literariamente-Biblio.apk             --repo "${GITHUB_REPOSITORY}"             --target "${GITHUB_SHA}"             --title "Literariamente $VERSION"             --notes "Cadastro bibliográfico com autor, ilustrador, título, editora e ano de publicação; capas da Open Library, câmera ou galeria. Preserva biblioteca e backups existentes."
