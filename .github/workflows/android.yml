name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Permitir execução do Gradle
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleDebug

      - name: Renomear APK
        run: mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/Literariamente-Biblio.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Literariamente-Biblio
          path: app/build/outputs/apk/debug/Literariamente-Biblio.apk
