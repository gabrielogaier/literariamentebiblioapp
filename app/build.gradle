plugins { id 'com.android.application' }

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    // Alinha bibliotecas Kotlin transitivas e evita classes duplicadas do AndroidX.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}

def buildNumber = providers.gradleProperty("appVersionCode").orElse("1").get().toInteger()
// Premium habilitado por padrão. A flag pode ser desativada explicitamente apenas em builds locais.
def premiumEnabled = providers.gradleProperty("premiumEnforcement").orElse("true").get().toBoolean()

android {
    namespace 'br.com.literariamente.biblioapp'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.literariamente.biblioapp'
        minSdk 24
        targetSdk 36
        versionCode = buildNumber
        versionName = "1.0." + buildNumber
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile = file(keystorePath)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'PREMIUM_ENFORCEMENT_ENABLED', String.valueOf(premiumEnabled)
        }
        release {
            // Premium ativo na versão de distribuição; validar produto e cortesias no Play Console.
            buildConfigField 'boolean', 'PREMIUM_ENFORCEMENT_ENABLED', String.valueOf(premiumEnabled)
            minifyEnabled false
            signingConfig = signingConfigs.release
        }
    }
}
