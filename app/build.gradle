plugins { id 'com.android.application' }

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
}

def buildNumber = providers.gradleProperty("appVersionCode").orElse("1").get().toInteger()

android {
    namespace 'br.com.literariamente.biblioapp'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.literariamente.biblioapp'
        minSdk 23
        targetSdk 36
        versionCode = buildNumber
        versionName = "1.0." + buildNumber
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
            if (keystorePath) {
                storeFile = file(keystorePath)
                storePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias = System.getenv("ANDROID_KEY_ALIAS")
                keyPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            buildConfigField 'boolean', 'PREMIUM_ENFORCEMENT_ENABLED', 'false'
        }
        release {
            // Ativar somente depois de configurar o produto e as cortesias no Play Console.
            buildConfigField 'boolean', 'PREMIUM_ENFORCEMENT_ENABLED', 'false'
            minifyEnabled false
            signingConfig = signingConfigs.release
        }
    }
}
